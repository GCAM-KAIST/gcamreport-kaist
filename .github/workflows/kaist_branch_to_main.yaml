# KAIST: bring kaist/v9.1-korea into main when the package branch has commits
# that main does not have yet. main is protected (changes only through PRs), so
# this opens a PR "kaist/v9.1-korea -> main" and merges it with a merge commit.
# kaist/v9.1-korea only changes through reviewed PRs and has no kaist/ folder,
# so kaist/ is left as it is. If the PR cannot be merged (conflicts), it stays
# open for a person to resolve.
name: kaist_branch_to_main

on:
  schedule:
    - cron: "0 0 * * *"   # every day, 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.repository == 'GCAM-KAIST/gcamreport-kaist'
    runs-on: ubuntu-latest
    steps:
      - name: Open and merge a PR from kaist/v9.1-korea
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$REPO/compare/main...kaist/v9.1-korea" --jq .ahead_by)
          echo "kaist/v9.1-korea has $ahead commit(s) that main does not have"
          if [ "$ahead" -eq 0 ]; then exit 0; fi
          # the package branch must never change kaist/
          if gh api "repos/$REPO/compare/main...kaist/v9.1-korea" --paginate --jq '.files[].filename' | grep -q '^kaist/'; then
            echo "kaist/v9.1-korea changes kaist/; stopping"; exit 1
          fi
          pr=$(gh pr list --repo "$REPO" --base main --head kaist/v9.1-korea --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --repo "$REPO" --base main --head kaist/v9.1-korea \
              --title "Merge kaist/v9.1-korea into main" \
              --body "Opened by the kaist_branch_to_main workflow: kaist/v9.1-korea has $ahead commit(s) that main does not have."
            pr=$(gh pr list --repo "$REPO" --base main --head kaist/v9.1-korea --state open --json number --jq '.[0].number')
          fi
          if ! gh pr merge "$pr" --repo "$REPO" --merge; then
            echo "PR #$pr could not be merged (conflicts?); left open"; exit 1
          fi
